[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sec-auditor"
version = "0.2.0"
description = "Restricted, evidence-oriented cloud security MCP service"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=2.3,<3",
  "google-auth>=2.39,<3",
  "alibabacloud-credentials>=1.0.12,<2",
  "alibabacloud-tea-openapi>=0.4.7,<1",
  "alibabacloud-tea-util>=0.3.15,<1",
  "oss2>=2.19.1,<3",
  "aliyun-log-python-sdk>=0.9.53,<1",
  "requests>=2.32,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "PyJWT[crypto]>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "respx>=0.22,<1", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
sec-auditor = "sec_auditor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_auditor"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/deploy", "/README.md", "/LICENSE", "/pyproject.toml", "/requirements.lock", "/Dockerfile", "/.dockerignore", "/.env.example", "/.github/workflows/ci.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
