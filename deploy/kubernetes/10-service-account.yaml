apiVersion: v1
kind: ServiceAccount
metadata:
  name: sec-auditor
  namespace: sec-auditor
  annotations:
    iam.gke.io/gcp-service-account: sec-auditor@SA_PROJECT_ID.iam.gserviceaccount.com
# ADC uses the GKE metadata server. This application does not use a mounted
# Kubernetes service-account token or in-cluster Kubernetes credentials.
automountServiceAccountToken: false
