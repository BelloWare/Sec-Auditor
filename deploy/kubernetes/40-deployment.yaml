apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-auditor
  namespace: sec-auditor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sec-auditor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sec-auditor
    spec:
      serviceAccountName: sec-auditor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Standard GKE: after enabling GKE_METADATA on the intended node pool,
      # uncomment these two lines. Autopilot already uses the GKE metadata server.
      # nodeSelector:
      #   iam.gke.io/gke-metadata-server-enabled: 'true'
      containers:
        - name: auditor
          image: REGION-docker.pkg.dev/IMAGE_PROJECT/REPOSITORY/sec-auditor@sha256:REPLACE_WITH_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          args: [serve, --transport, http, --host, 0.0.0.0, --port, '8000']
          envFrom:
            - configMapRef:
                name: sec-auditor-config
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: sec-auditor.sec-auditor.svc.cluster.local:8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: sec-auditor.sec-auditor.svc.cluster.local:8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: sec-auditor.sec-auditor.svc.cluster.local:8000
            periodSeconds: 20
          volumeMounts:
            - name: state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: sec-auditor-state
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
